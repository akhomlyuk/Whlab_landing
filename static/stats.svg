<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Whitehat Lab">
  <!-- Три столбика сигнала: щит, паук, столб. Акцент охра (#d9a441)
       на почти чёрном фоне (#0a0a0b) даёт 7.72:1, а три непрозрачности
       0.70 / 0.85 / 1.00 и поднимают к 5.05:1 — это уже ниже порога
       для мелких знаков.
       Радиусы столбиков снижены с 1.75 до 1, и рамка с rx=7 до rx=2:
       в интерфейсе углы теперь 2px, и скруглённая иконка рядом с
       прямыми углами читалась бы из другой эпохи.
       Комментарий написан словами и без двойных дефисов: SVG разбирается
       как XML, где знаки сравнения и повторный дефис недопустимы. -->
  <rect width="32" height="32" rx="2" fill="#0a0a0b"/>
  <g fill="#d9a441">
    <rect x="6.5" y="18.5" width="4.5" height="7" rx="1" fill-opacity="0.7"/>
    <rect x="13.75" y="13.5" width="4.5" height="12" rx="1" fill-opacity="0.85"/>
    <rect x="21" y="7.5" width="4.5" height="18" rx="1"/>
  </g>
</svg>